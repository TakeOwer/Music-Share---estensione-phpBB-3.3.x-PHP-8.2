<!--
	Elenco di tonalità suggerite per il campo "Tonalità".
	È un datalist e non un menu a tendina: chi conosce la notazione può
	continuare a scrivere quello che vuole, compresi valori che qui non
	compaiono, mentre chi non la conosce sceglie dall'elenco.
	Le tonalità già salvate non vengono toccate.
-->
<datalist id="musicshare-keys">
	<!-- BEGIN key_options -->
	<option value="{key_options.VALUE}">{key_options.LABEL}</option>
	<!-- END key_options -->
</datalist>
