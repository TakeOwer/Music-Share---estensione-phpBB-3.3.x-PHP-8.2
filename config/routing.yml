salvocortesiano_musicshare_user:
    path: /musicshare/user/{user_id}
    defaults: { _controller: salvocortesiano.musicshare.controller.main:user_songs }
    requirements:
        user_id: \d+

salvocortesiano_musicshare_ajax_recent:
    path: /musicshare/ajax/recent
    defaults: { _controller: salvocortesiano.musicshare.controller.ajax:recent }
    methods: [GET]

salvocortesiano_musicshare_ajax_vote:
    path: /musicshare/ajax/vote
    defaults: { _controller: salvocortesiano.musicshare.controller.ajax:vote }
    methods: [POST]

salvocortesiano_musicshare_uploaders:
    path: /musicshare/uploaders
    defaults: { _controller: salvocortesiano.musicshare.controller.main:uploaders }

salvocortesiano_musicshare_ajax_embed:
    path: /musicshare/ajax/embed
    defaults: { _controller: salvocortesiano.musicshare.controller.ajax:embed }
